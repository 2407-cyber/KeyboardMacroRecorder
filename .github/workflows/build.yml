name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build EXE
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name "键盘宏" keyboard_macro_recorder_v3.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 键盘宏-Windows
          path: dist/键盘宏.exe
