name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "KeyboardMacroRecorder" keyboard_macro_recorder_v3.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardMacroRecorder-Windows
          path: dist/KeyboardMacroRecorder.exe
